name: AgentKeeper
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  bundleIdPrefix: com.ahmeddiab.agentkeeper
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    ENABLE_HARDENED_RUNTIME: YES
    # Ad-hoc signing builds on any local machine. Developers who want stable
    # Accessibility grants across rebuilds can set their own team/identity in a
    # private local override or in Xcode.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  AgentKeeperCore:
    path: AgentKeeperCore
targets:
  AgentKeeperApp:
    type: application
    platform: macOS
    sources:
      - path: AgentKeeperApp
    resources:
      - path: AgentKeeperApp/Resources
    dependencies:
      - package: AgentKeeperCore
        product: AgentKeeperCore
      - target: agentkeeper-hook
        embed: true
        copy:
          destination: executables
    info:
      path: AgentKeeperApp/Info.plist
      properties:
        CFBundleName: Agent Keeper
        CFBundleDisplayName: Agent Keeper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Ahmed Diab. All rights reserved."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmeddiab.agentkeeper.app
        PRODUCT_NAME: Agent Keeper
        CODE_SIGN_ENTITLEMENTS: AgentKeeperApp/AgentKeeperApp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SKIP_INSTALL: NO
        SWIFT_OBJC_BRIDGING_HEADER: ""

  agentkeeper-hook:
    type: tool
    platform: macOS
    sources:
      - path: agentkeeper-hook
    settings:
      base:
        PRODUCT_NAME: agentkeeper-hook
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmeddiab.agentkeeper.hook
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        # Inherit signing settings from the project base settings.
        CODE_SIGN_STYLE: Manual
